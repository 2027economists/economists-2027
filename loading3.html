<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Loader</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle, #0f2027, #203a43, #2c5364);
    overflow: hidden;
    color: white;
    position: relative;
}

/* Navigation Button */
.nav-button {
    position: absolute;
    top: 20px;
    right: 20px;
    background: #007bff;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 5px;
    font-size: 14px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    transition: background 0.3s ease;
    z-index: 100;
}

.nav-button:hover {
    background: #0056b3;
}

.container {
    text-align: center;
}

/* =========================
   ORBIT + BALL + TRAIL
========================= */
.orbit {
    width: 180px;
    height: 180px;
    position: relative;
    margin: 0 auto 40px;
}

.ball {
    width: 12px;
    height: 12px;
    background: #00eaff;
    border-radius: 50%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform-origin: -80px center;
    animation: orbit 2s linear infinite;
    z-index: 10;
}

/* Fading trail elements */
.trail {
    width: 8px;
    height: 8px;
    background: #00eaff;
    border-radius: 50%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform-origin: -80px center;
    animation: orbit 2s linear infinite;
    opacity: 0;
}

.trail:nth-child(2) {
    animation-delay: -0.2s;
    opacity: 0.8;
}

.trail:nth-child(3) {
    animation-delay: -0.4s;
    opacity: 0.6;
}

.trail:nth-child(4) {
    animation-delay: -0.6s;
    opacity: 0.4;
}

.trail:nth-child(5) {
    animation-delay: -0.8s;
    opacity: 0.2;
}

/* Orbit animation */
@keyframes orbit {
    0% {
        transform: rotate(0deg) translateX(80px);
    }
    100% {
        transform: rotate(360deg) translateX(80px);
    }
}

/* =========================
   TEXT SPLIT EFFECT
========================= */

.text {
    font-size: 24px;
    display: inline-block;
    position: relative;
}

/* Each letter */
.text span {
    display: inline-block;
    opacity: 0;
    animation: assemble 4s ease-in-out infinite;
}

/* Delay each letter */
.text span:nth-child(1) { animation-delay: 0s; }
.text span:nth-child(2) { animation-delay: 0.05s; }
.text span:nth-child(3) { animation-delay: 0.1s; }
.text span:nth-child(4) { animation-delay: 0.15s; }
.text span:nth-child(5) { animation-delay: 0.2s; }
.text span:nth-child(6) { animation-delay: 0.25s; }
.text span:nth-child(7) { animation-delay: 0.3s; }
.text span:nth-child(8) { animation-delay: 0.35s; }
.text span:nth-child(9) { animation-delay: 0.4s; }
.text span:nth-child(10){ animation-delay: 0.45s; }
.text span:nth-child(11){ animation-delay: 0.5s; }
.text span:nth-child(12){ animation-delay: 0.55s; }
.text span:nth-child(13){ animation-delay: 0.6s; }
.text span:nth-child(14){ animation-delay: 0.65s; }
.text span:nth-child(15){ animation-delay: 0.7s; }
.text span:nth-child(16){ animation-delay: 0.75s; }
.text span:nth-child(17){ animation-delay: 0.8s; }
.text span:nth-child(18){ animation-delay: 0.85s; }
.text span:nth-child(19){ animation-delay: 0.9s; }
.text span:nth-child(20){ animation-delay: 0.95s; }

/* Animation: scatter → reassemble */
@keyframes assemble {
    0% {
        opacity: 0;
        transform: translate(0,0);
    }

    20% {
        opacity: 1;
        transform: translate(0,0);
    }

    /* Scatter outward */
    40% {
        transform: translate(
            calc(-200px + 400px * random()),
            calc(-150px + 300px * random())
        );
        opacity: 0.3;
    }

    /* Return */
    70% {
        transform: translate(0,0);
        opacity: 1;
    }

    100% {
        transform: translate(0,0);
        opacity: 1;
    }
}

</style>
</head>

<body>

<!-- Navigation Button -->
<a href="index.html" class="nav-button">Home</a>

<div class="container">

    <div class="orbit">
        <div class="ball"></div>
        <div class="trail"></div>
        <div class="trail"></div>
        <div class="trail"></div>
        <div class="trail"></div>
        <div class="trail"></div>
    </div>

    <div class="text">
        <!-- Each letter wrapped -->
        <span>w</span><span>i</span><span>l</span><span>l</span>
        <span>&nbsp;</span>
        <span>b</span><span>e</span>
        <span>&nbsp;</span>
        <span>u</span><span>p</span><span>l</span><span>o</span><span>a</span><span>d</span><span>e</span><span>d</span>
        <span>&nbsp;</span>
        <span>s</span><span>o</span><span>o</span><span>n</span>
    </div>

</div>

</body>
</html>
